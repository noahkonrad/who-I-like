<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Who I Like...</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   GENERAL SCREEN
========================= */

.screen {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    text-align: center;
}


/* =========================
   INTRO
========================= */

#intro {
    background:
        radial-gradient(circle, #252525, #000);

    color: white;

    z-index: 100;
}

#intro h1 {
    font-size: clamp(45px, 9vw, 110px);
    margin-bottom: 20px;
    letter-spacing: 4px;
}

#intro p {
    color: #aaa;
    font-size: clamp(18px, 3vw, 27px);
    margin-bottom: 35px;
}

#revealButton {
    padding: 20px 45px;

    border: none;
    border-radius: 12px;

    background: white;
    color: black;

    font-size: 24px;
    font-weight: bold;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

#revealButton:hover {
    transform: scale(1.08);

    box-shadow:
        0 0 30px rgba(255,255,255,.5);
}


/* =========================
   DECRYPTING
========================= */

#decrypt {
    display: none;

    background: #030303;
    color: white;

    z-index: 90;
}

#status {
    font-family: monospace;

    font-size: clamp(18px, 4vw, 32px);

    min-height: 45px;

    margin-bottom: 25px;
}

#count {
    font-family: monospace;

    font-size: clamp(80px, 15vw, 170px);

    font-weight: bold;
}


/* =========================
   ERROR
========================= */

#error {
    display: none;

    background: #000;
    color: white;

    z-index: 85;
}

#error h1 {
    font-family: monospace;

    font-size: clamp(50px, 10vw, 110px);

    margin-bottom: 20px;
}

#error p {
    color: #999;

    font-family: monospace;

    font-size: 20px;
}


/* =========================
   FINAL REVEAL
========================= */

#final {
    display: none;

    background: #000;
    color: white;

    z-index: 80;
}

#final h2 {
    font-size: clamp(25px, 5vw, 55px);

    margin-bottom: 35px;
}

#identity {
    font-family: monospace;

    font-size: clamp(35px, 8vw, 100px);

    font-weight: bold;

    letter-spacing: 8px;

    animation: identityAppear 1s ease;
}

#final p {
    margin-top: 30px;

    color: #777;

    font-size: 18px;
}

@keyframes identityAppear {

    from {
        opacity: 0;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================
   BLACK COVER
========================= */

#black {
    display: none;

    background: #000;

    z-index: 200;
}


/* =========================
   VIDEO
========================= */

#video {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    border: none;

    display: none;

    z-index: 150;
}


/* =========================
   PRANK MESSAGE
========================= */

#message {
    position: fixed;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    display: none;

    padding: 15px 25px;

    border-radius: 10px;

    background: rgba(0,0,0,.85);

    color: white;

    font-size: clamp(15px, 2.5vw, 25px);

    text-align: center;

    z-index: 250;
}

</style>
</head>


<body>


<!-- =========================
     INTRO
========================= -->

<div id="intro" class="screen">

    <h1>WHO I LIKE...</h1>

    <p>
        You've been asking long enough.
    </p>

    <button id="revealButton">
        REVEAL
    </button>

</div>


<!-- =========================
     DECRYPTING
========================= -->

<div id="decrypt" class="screen">

    <div id="status">
        Initializing secure connection...
    </div>

    <div id="count">
        5
    </div>

</div>


<!-- =========================
     ERROR
========================= -->

<div id="error" class="screen">

    <h1>
        ERROR
    </h1>

    <p>
        Decryption failed.
    </p>

    <p>
        Attempting recovery...
    </p>

</div>


<!-- =========================
     FINAL REVEAL
========================= -->

<div id="final" class="screen">

    <h2>
        IDENTITY CONFIRMED
    </h2>

    <div id="identity">
        IDENTITY REDACTED
    </div>

    <p>
        Preparing final transmission...
    </p>

</div>


<!-- =========================
     BLACK COVER
========================= -->

<div id="black" class="screen"></div>


<!-- =========================
     YOUTUBE VIDEO
========================= -->

<iframe
    id="video"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>


<!-- =========================
     FINAL PRANK MESSAGE
========================= -->

<div id="message">
    YOU REALLY THOUGHT I WAS GOING TO TELL YOU? 💀
</div>


<script>

/* =========================
   ELEMENTS
========================= */

const revealButton =
    document.getElementById("revealButton");

const intro =
    document.getElementById("intro");

const decrypt =
    document.getElementById("decrypt");

const status =
    document.getElementById("status");

const count =
    document.getElementById("count");

const error =
    document.getElementById("error");

const finalScreen =
    document.getElementById("final");

const black =
    document.getElementById("black");

const video =
    document.getElementById("video");

const message =
    document.getElementById("message");


/* =========================
   REVEAL BUTTON
========================= */

revealButton.onclick = function() {

    intro.style.display = "none";

    decrypt.style.display = "flex";

    startCountdown();

};


/* =========================
   COUNTDOWN
========================= */

function startCountdown() {

    let number = 5;

    const messages = [

        "Initializing secure connection...",

        "Connecting to classified database...",

        "Authenticating requester...",

        "Decrypting information...",

        "Identity located..."

    ];


    function run() {

        count.textContent = number;

        status.textContent =
            messages[5 - number];


        if (number === 0) {

            decrypt.style.display = "none";

            startFakeDecryption();

            return;
        }


        number--;

        setTimeout(
            run,
            1000
        );

    }


    run();

}


/* =========================
   FAKE DECRYPTION
========================= */

function startFakeDecryption() {

    decrypt.style.display = "flex";

    let percent = 0;


    function progress() {

        count.textContent =
            percent + "%";

        status.textContent =
            "Decrypting identity...";


        if (percent >= 99) {

            decrypt.style.display = "none";

            showError();

            return;
        }


        percent++;


        let delay = 30;


        if (percent > 85) {
            delay = 90;
        }


        setTimeout(
            progress,
            delay
        );

    }


    progress();

}


/* =========================
   FAKE ERROR
========================= */

function showError() {

    error.style.display = "flex";


    setTimeout(function() {

        error.style.display = "none";

        finalScreen.style.display = "flex";


        setTimeout(function() {

            finalScreen.style.display = "none";

            playVideo();

        }, 3000);


    }, 1800);

}


/* =========================
   PLAY VIDEO
========================= */

function playVideo() {

    /*
       Keep the screen black while
       YouTube loads.
    */

    black.style.display = "flex";


    /*
       Your selected YouTube video.
    */

    video.src =
        "https://www.youtube.com/embed/QDia3e12czc" +
        "?autoplay=1" +
        "&mute=0" +
        "&controls=0" +
        "&rel=0" +
        "&playsinline=1";


    /*
       Wait for the video to load
       before revealing it.
    */

    setTimeout(function() {

        black.style.display = "none";

        video.style.display = "block";


        /*
           Show the prank message
           after the video starts.
        */

        setTimeout(function() {

            message.style.display = "block";

        }, 1500);


    }, 1800);

}

</script>

</body>
</html>
